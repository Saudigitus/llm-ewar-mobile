name: ClimaSaude
options:
  bundleIdPrefix: org.saudigitus
targets:
  ClimaSaude:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Clima Saúde Community
        UILaunchScreen: {}
        BASE_URL: "$(BASE_URL)"
        ALERTS_BASE_URL: "$(ALERTS_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.saudigitus.climasaude
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ClimaSaudeShared"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    preBuildScripts:
      - name: Build shared framework
        script: |
          cd "$SRCROOT/.."
          sh ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
